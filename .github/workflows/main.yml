name: Daily GEX Update

on:
  schedule:
    - cron: '30 22 * * 1-5'  # รันทุกวันจันทร์-ศุกร์ เวลา 22:30 UTC
  workflow_dispatch:          # อนุญาตให้กดรันเองด้วยมือได้

jobs:
  update-gex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GEX fetcher
        run: |
          export PYTHONPATH=scripts
          python scripts/fetch_gex.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update GEX data.json [skip ci]"
          git push
